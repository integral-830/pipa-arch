version: 2.1

# ---------------------------------------------------------------------------
# CircleCI can't do privileged Docker (loop devices, mkfs, mount --bind) on
# the default `docker` executor, so full image assembly needs the `machine`
# executor (a real VM, same reason GitHub Actions ubuntu-latest works for
# this too). Full builds also take 30-90+ minutes per the README, so they
# run only via manual approval, the nightly scheduled pipeline, or a tag
# push (which also cuts a GitHub Release) -- never on every commit.
# ---------------------------------------------------------------------------

parameters:
  pipa_include_sensors:
    type: string
    default: "1"
  pipa_include_extras:
    type: string
    default: "1"

executors:
  docker-small:
    docker:
      - image: cimg/base:2024.02
    resource_class: medium
  linux-vm:
    machine:
      image: ubuntu-2204:current
    resource_class: xlarge

jobs:
  lint:
    executor: docker-small
    steps:
      - checkout
      - run:
          name: Install shellcheck + hadolint
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y shellcheck
            curl -sL -o /tmp/hadolint \
              https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
            chmod +x /tmp/hadolint
      - run:
          name: bash -n syntax check
          command: |
            bash -n builder/build-image.sh
            bash -n scripts/build-from-source.sh
      - run:
          name: shellcheck
          command: shellcheck -S warning builder/build-image.sh scripts/build-from-source.sh
      - run:
          name: hadolint (Dockerfile)
          command: /tmp/hadolint --ignore DL3008 --ignore DL3018 builder/Dockerfile
      - run:
          name: make help sanity check
          command: make help

  build-builder-image:
    executor: linux-vm
    steps:
      - checkout
      - run:
          name: Register aarch64 binfmt (QEMU)
          command: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - run:
          name: Build builder image
          command: docker build builder -t archlinux-pipa-builder:ci
      - run:
          name: Smoke-test entrypoint (--help)
          command: docker run --rm archlinux-pipa-builder:ci --help

  build-image:
    parameters:
      de:
        type: enum
        enum: ["plasma", "gnome", "base"]
    executor: linux-vm
    steps:
      - checkout
      - run:
          name: Register aarch64 binfmt (QEMU)
          command: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - run:
          name: Free disk space
          command: |
            df -h /
            docker system prune -af || true
      - run:
          name: Build << parameters.de >> image
          command: |
            mkdir -p images
            make << parameters.de >> \
              BUILD_GIT_REV="${CIRCLE_SHA1}" \
              PIPA_INCLUDE_SENSORS="<< pipeline.parameters.pipa_include_sensors >>" \
              PIPA_INCLUDE_EXTRAS="<< pipeline.parameters.pipa_include_extras >>"
          no_output_timeout: 90m
      - run:
          name: Verify output
          command: |
            shopt -s nullglob
            zips=(images/*.zip)
            if [ "${#zips[@]}" -eq 0 ]; then
              echo "No .zip produced in images/ -- build did not complete" >&2
              exit 1
            fi
            for z in "${zips[@]}"; do
              echo "--- $z ---"
              unzip -l "$z"
            done
      - run:
          name: Checksum + BUILDINFO
          command: |
            cd images
            sha256sum *.zip | tee SHA256SUMS-<< parameters.de >>.txt
            for z in *.zip; do
              unzip -p "$z" BUILDINFO.txt 2>/dev/null || true
            done
      - store_artifacts:
          path: images
          destination: images
      - persist_to_workspace:
          root: images
          paths: ["*.zip", "SHA256SUMS-*.txt"]

  release:
    docker:
      - image: cimg/base:2024.02
    steps:
      - attach_workspace:
          at: images
      - run:
          name: Combine checksums
          command: cat images/SHA256SUMS-*.txt > images/SHA256SUMS.txt
      - run:
          name: Install GitHub CLI
          command: |
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list
            sudo apt-get update -qq && sudo apt-get install -y gh
      - run:
          name: Create GitHub Release
          # Requires a GITHUB_TOKEN with `repo` scope set in a CircleCI
          # context or project environment variable.
          command: |
            gh release create "${CIRCLE_TAG}" images/*.zip images/SHA256SUMS.txt \
              --repo "${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}" \
              --generate-notes

workflows:
  # Runs on every push/PR: fast lint + builder-image build only.
  ci:
    jobs:
      - lint
      - build-builder-image:
          requires: [lint]
      - hold-full-build:
          type: approval
          requires: [build-builder-image]
      - build-image:
          name: build-plasma
          de: plasma
          requires: [hold-full-build]
      - build-image:
          name: build-gnome
          de: gnome
          requires: [hold-full-build]
      - build-image:
          name: build-base
          de: base
          requires: [hold-full-build]

  # Nightly canary against upstream pipa-pkgs / pipa-alarm repos, which
  # have had outages before (see README). Configure this as a Scheduled
  # Pipeline in the CircleCI project UI pointing at this workflow, or keep
  # this trigger block if your project still uses the legacy scheduler.
  nightly-full-build:
    triggers:
      - schedule:
          cron: "0 4 * * *"
          filters:
            branches:
              only: [main]
    jobs:
      - lint
      - build-builder-image:
          requires: [lint]
      - build-image:
          name: build-plasma
          de: plasma
          requires: [build-builder-image]
      - build-image:
          name: build-gnome
          de: gnome
          requires: [build-builder-image]
      - build-image:
          name: build-base
          de: base
          requires: [build-builder-image]

  # Tag push (v1.2.3 etc.): full build of all three images, then publish a
  # GitHub Release with the zips + combined checksums attached. Needs a
  # GITHUB_TOKEN (repo scope) set as a project environment variable or in
  # a context this workflow's jobs can access.
  release-build:
    jobs:
      - lint:
          filters: &tags-only
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - build-builder-image:
          requires: [lint]
          filters: *tags-only
      - build-image:
          name: build-plasma
          de: plasma
          requires: [build-builder-image]
          filters: *tags-only
      - build-image:
          name: build-gnome
          de: gnome
          requires: [build-builder-image]
          filters: *tags-only
      - build-image:
          name: build-base
          de: base
          requires: [build-builder-image]
          filters: *tags-only
      - release:
          requires: [build-plasma, build-gnome, build-base]
          filters: *tags-only
