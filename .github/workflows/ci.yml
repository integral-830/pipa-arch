name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Fast, cheap checks that run on every push/PR.
  # ---------------------------------------------------------------------
  lint:
    name: Shellcheck + Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck build scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          severity: warning

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: builder/Dockerfile
          # DL3008/DL3018 (pin apt/pacman package versions) don't apply
          # cleanly to a rolling-release Arch base image.
          ignore: DL3008,DL3018

      - name: bash -n syntax check
        run: |
          bash -n builder/build-image.sh
          bash -n scripts/build-from-source.sh

      - name: make help sanity check
        run: make help

  # ---------------------------------------------------------------------
  # Build (but don't run) the builder Docker image on every push/PR.
  # This alone catches most breakage: pacman package renames/removals,
  # base-image changes, COPY/permission mistakes, etc. -- without needing
  # privileged mode, loop devices, or a 30-90 min pacstrap run.
  # ---------------------------------------------------------------------
  build-builder-image:
    name: Build builder image (no image assembly)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (aarch64 emulation, needed by the ARM base image)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build builder image
        uses: docker/build-push-action@v6
        with:
          context: builder
          platforms: linux/arm64
          push: false
          load: true
          tags: archlinux-pipa-builder:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test entrypoint (--help, no root/privileged needed)
        run: |
          docker run --rm --platform linux/arm64 archlinux-pipa-builder:ci --help

# Full, real image assembly (--privileged, loop devices, 30-90+ min) lives
# in its own workflow: .github/workflows/full-image-build.yml -- triggered
# manually, on tag push, or on a weekly schedule, not on every push/PR.
